<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aplikasi Puisi</title>

    <link rel="stylesheet" href="styletwo.css">
</head>

<body>

    <div class="dashboard">

    <h2>Dashboard</h2>

        <div class="dashboard-cards">

            <!-- SUBMIT -->
            <div class="dashboard-card">

                <h2>Submission Form</h2>

                <input
                    id="judul"
                    type="text"
                    placeholder="Title"
                >

                <textarea
                    id="isi"
                    placeholder="Content"
                ></textarea>

                <input
                    id="kategori"
                    type="text"
                    placeholder="Category"
                >

                <input
                    id="keyword"
                    type="text"
                    placeholder="Keywords"
                >

                <p id="puisiResult"></p>


                <button
                    id="submitButton"
                    onclick="submitPuisi()"
                >
                    Submit Puisi
                </button>

            </div>


            <!-- LIST -->
            <div class="dashboard-card">

                <h2>Submitted Poem</h2>

                <div id="puisiList"></div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
