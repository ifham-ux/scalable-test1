<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aplikasi Puisi - Authentication</title>

    <link
        rel="stylesheet"
        href="styleone.css"
    >

</head>

<body>

    <div id="authentication">

        <h2 id="formTitle">
            Login
        </h2>

        <div
            id="containerName"
            style="display: none;"
        >

            <input
                id="fullName"
                type="text"
                placeholder="Full Name"
            >

            <br><br>

        </div>


        <!-- Username -->

        <input
            id="username"
            type="text"
            placeholder="Username"
        >

        <br><br>


        <!-- Password -->

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <br><br>

        <p id="result"></p>


        <!-- Main button -->

        <button
            id="submitButton"
            onclick="submitAuthentication()"
        >
            Login
        </button>


        <div class="toggle-container">
            <p id="toggleText">Belum memiliki akun?</p>

                <button id="toggleButton" onclick="toggleAuthentication()">
                    Register
                </button>
        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
