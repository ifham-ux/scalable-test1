<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Puisi - Authentication</title>

</head>

<body>
<h1>Aplikasi Puisi</h1>

<div id="authentication">

    <h2 id="formTitle">Login</h2>

    <!-- Username -->
    <input
        id="username"
        type="text"
        placeholder="Username"
    >

    <br><br>

    <!-- fullName -->
    <div id="containerName" style="display: none;">
        <input
            id="fullName"
            type="text"
            placeholder="Nama lengkap"
        >

        <br><br>
    </div>

    <!-- Password -->
    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <br><br>

    <!-- Main button -->
    <button id="submitButton" onclick="submitAuthentication()">
        Login
    </button>

    <p id="result"></p>

    <hr>

    <!-- Toggle button -->
    <p id="toggleText">
        Belum memiliki akun?
    </p>

    <button id="toggleButton" onclick="toggleAuthentication()">
        Register
    </button>

</div>


<script src = "app.js"></script>


</body>
</html>
